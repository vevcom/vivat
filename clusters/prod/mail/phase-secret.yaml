# The operator writes the mail server's secrets from Phase into mail-env and keeps them in sync.
# It logs in with phase-service-token, created by hand once, see README.md.
apiVersion: secrets.phase.dev/v1alpha1
kind: PhaseSecret
metadata:
    name: mail-env
    annotations:
        argocd.argoproj.io/sync-wave: "-1"
spec:
    phaseAppId: d7a0b056-c45f-427e-b833-994ad10b2d49
    phaseAppEnv: production
    phaseAppEnvPath: /
    phaseHost: https://console.phase.dev
    pollingInterval: 60
    authentication:
        serviceToken:
            serviceTokenSecretReference:
                secretName: phase-service-token
                secretNamespace: mail
    managedSecretReferences:
        - secretName: mail-env
          secretNamespace: mail
          secretType: Opaque
