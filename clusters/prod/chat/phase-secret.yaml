# The operator writes the chat's secrets from Phase into chat-env and keeps them in sync, see
# README.md for the keys. It logs in with phase-service-token, created by hand once.
apiVersion: secrets.phase.dev/v1alpha1
kind: PhaseSecret
metadata:
    name: chat-env
    annotations:
        argocd.argoproj.io/sync-wave: "-1"
spec:
    # TODO: the id of the chat app in Phase, once it is made.
    phaseAppId: 00000000-0000-0000-0000-000000000000
    phaseAppEnv: production
    phaseAppEnvPath: /
    phaseHost: https://console.phase.dev
    pollingInterval: 60
    authentication:
        serviceToken:
            serviceTokenSecretReference:
                secretName: phase-service-token
                secretNamespace: chat
    managedSecretReferences:
        - secretName: chat-env
          secretNamespace: chat
          secretType: Opaque
