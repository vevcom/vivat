# omega.ntnu.no and its sites: the overlay in clusters/prod/omegaweb, which pulls omegaweb-next's
# manifests at the release it names. See README.md for how a release gets there.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
    name: omegaweb
    namespace: argocd
    annotations:
        argocd.argoproj.io/sync-wave: "0"
spec:
    project: default
    source:
        repoURL: https://github.com/vevcom/vivat.git
        path: clusters/prod/omegaweb
        targetRevision: main
    destination:
        server: https://kubernetes.default.svc
    syncPolicy:
        automated:
            prune: true
            selfHeal: true
        # The first sync of a fresh cluster runs before the operators' CRDs exist.
        retry:
            limit: 10
            backoff:
                duration: 30s
                maxDuration: 5m
