# omega.ntnu.no and its sites. The release that runs is named twice below, and release.yml in
# omegaweb-next opens the pull request that moves both: the ref the base is pulled at, and the
# tag of the two images.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: omegaweb-next

resources:
    - namespace.yaml
    - https://github.com/vevcom/omegaweb-next//deploy/base?ref=v26.4.0
    - database-backup.yaml
    - phase-secret.yaml
    - redirect-https.yaml

configMapGenerator:
    - name: omegaweb-next-sites
      files:
          - sites.json
      # The migrate job in wave -1 mounts it too.
      options:
          annotations:
              argocd.argoproj.io/sync-wave: "-3"
    # The store keys, STORE_S3_ACCESS_KEY_ID and STORE_S3_SECRET_ACCESS_KEY, come from Phase. The
    # webmail is the one in clusters/prod/mail: its host is the domain of the accounts that sign in
    # and the client the app issues tokens to, so it is the same host as there, see README.md.
    - name: omegaweb-next-config
      behavior: merge
      literals:
          - STORE_S3_ENDPOINT=https://s3.trd1.stack.it.ntnu.no
          - STORE_S3_BUCKET=argo-prod-bucket
          - EMAIL_WEBMAIL_URL=https://mail.omega.ntnu.no
          # The chat's sign in is the one in clusters/prod/chat: its host is the client the app issues
          # tokens to, so it is the same host as there, see README.md.
          - CHAT_AUTH_URL=https://account.chat.omega.ntnu.no
          # The chat client, which a user's chat page links to.
          - CHAT_CLIENT_URL=https://chat.omega.ntnu.no
          # The homeserver in clusters/prod/chat, as the worker reaches it inside the cluster to keep
          # its accounts and spaces in step. The three secrets that go with these come from Phase,
          # and the chat has the same values: CHAT_AS_TOKEN, CHAT_MAS_CLIENT_SECRET, and
          # CHAT_HS_TOKEN, which Synapse signs the events it sends the app with.
          - CHAT_HOMESERVER_URL=http://synapse.chat:8008
          - CHAT_SERVER_NAME=chat.omega.ntnu.no
          - CHAT_MAS_URL=http://mas.chat:8081

images:
    - name: omegaweb-next
      newName: ghcr.io/vevcom/omegaweb-next
      newTag: v26.4.0
    - name: omegaweb-next-tools
      newName: ghcr.io/vevcom/omegaweb-next-tools
      newTag: v26.4.0

patches:
    - path: ingress-patch.yaml
    - path: database-patch.yaml
    # The images are private because the build bakes in NEXT_SERVER_ACTIONS_ENCRYPTION_KEY.
    # ghcr-pull is created by hand, like phase-service-token.
    - target:
          kind: (Deployment|Job)
      patch: |-
          - op: add
            path: /spec/template/spec/imagePullSecrets
            value:
                - name: ghcr-pull
